name: Verify FTUCharm
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The isolated Vitest browser journey also launches Chromium.
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:e2e:auth
      - run: npx --no-install wrangler deploy --config apps/api/wrangler.jsonc --dry-run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: |
            test-results/
            test-results-auth/
          retention-days: 7
